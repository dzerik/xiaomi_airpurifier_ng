# Quality Scale for Xiaomi Air Purifier NG Integration
# Based on Home Assistant Integration Quality Scale
# https://developers.home-assistant.io/docs/integration_quality_scale_index/

rules:
  # Bronze Level - Required for all integrations
  action-setup:
    status: done
    comment: Uses standard entity actions; no custom service registration
  appropriate-polling:
    status: done
    comment: Using DataUpdateCoordinator with 30 second interval
  brands:
    status: exempt
    comment: Custom integration, not in Home Assistant brands
  common-modules:
    status: done
    comment: Using homeassistant.helpers and standard patterns
  config-flow:
    status: done
    comment: Full config flow with user, import, reconfigure, and reauth steps
  config-flow-test-coverage:
    status: done
    comment: Tests in tests/test_config_flow.py
  dependency-transparency:
    status: done
    comment: python-miio is declared in manifest.json
  docs-actions:
    status: done
    comment: Legacy services removed; functionality provided via entity platforms (switch, number, select, button)
  docs-high-level-description:
    status: done
    comment: README.md provides overview
  docs-installation-instructions:
    status: done
    comment: README.md includes HACS and manual installation
  docs-removal-instructions:
    status: done
    comment: Standard HA integration removal
  entity-event-setup:
    status: exempt
    comment: No event entities
  entity-unique-id:
    status: done
    comment: Existing entity unique IDs are based on entry_id plus a stable suffix; tests/test_device_identity.py verifies preservation
  has-entity-name:
    status: done
    comment: All entities use has_entity_name = True
  runtime-data:
    status: done
    comment: Using entry.runtime_data for coordinator
  test-before-configure:
    status: todo
    comment: Manual setup tests connectivity; cloud setup can save an offline supported device
  test-before-setup:
    status: done
    comment: Connection validated in async_setup_entry
  unique-config-entry:
    status: done
    comment: MAC-based unique ID prevents duplicates

  # Silver Level
  action-exceptions:
    status: done
    comment: Invalid actions raise ServiceValidationError, transport failures raise HomeAssistantError; contract tests exercise both
  config-entry-unloading:
    status: done
    comment: async_unload_entry implemented and tested
  docs-configuration-parameters:
    status: done
    comment: Host, token, model documented in README
  docs-troubleshooting:
    status: done
    comment: README troubleshooting covers IP, token, network and unsupported models
  entity-unavailable:
    status: done
    comment: Coordinator handles unavailable state
  integration-owner:
    status: exempt
    comment: Custom integration
  log-when-unavailable:
    status: done
    comment: Coordinator logs connection failures
  parallel-updates:
    status: done
    comment: Using DataUpdateCoordinator
  reauthentication-flow:
    status: done
    comment: async_step_reauth implemented
  test-coverage:
    status: todo
    comment: Full suite runs against minimum and current HA; coverage is reported in CI without claiming the quality-scale threshold

  # Gold Level
  devices:
    status: done
    comment: Device registered via device_info
  diagnostics:
    status: done
    comment: diagnostics.py with token redaction
  discovery:
    status: exempt
    comment: Xiaomi devices don't support standard discovery
  discovery-update-info:
    status: exempt
    comment: No discovery support
  docs-data-update:
    status: done
    comment: README documents the default 30-second polling interval and Options
  docs-examples:
    status: done
    comment: README includes automation examples
  docs-known-limitations:
    status: done
    comment: README documents humidity limits, unsupported models and preset migration
  docs-supported-devices:
    status: done
    comment: SUPPORTED_MODELS in const.py, listed in README
  docs-supported-functions:
    status: done
    comment: Features documented per device type
  docs-use-cases:
    status: done
    comment: Use cases in README
  dynamic-devices:
    status: exempt
    comment: Single device per config entry
  entity-category:
    status: done
    comment: Diagnostic entities properly categorized
  entity-device-class:
    status: done
    comment: Standard device classes used
  entity-disabled-by-default:
    status: todo
    comment: Some entities disabled by default
  entity-translations:
    status: done
    comment: All 14 translations have matching source keys and placeholders
  exception-translations:
    status: done
    comment: All command validation and rejection errors have tested translation keys and matching placeholders in 14 languages
  icon-translations:
    status: todo
    comment: Entity icons use descriptions; icon translations are not yet provided
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure implemented
  repair-issues:
    status: todo
    comment: Not implemented yet
  stale-devices:
    status: exempt
    comment: Single device per entry

  # Platinum Level
  async-dependency:
    status: todo
    comment: python-miio is synchronous, uses executor
  inject-websession:
    status: exempt
    comment: Using local protocol, not HTTP
  strict-typing:
    status: todo
    comment: Need full type annotations and mypy checking

# No aggregate quality tier is claimed; outstanding rules remain todo.
