name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Get version from manifest
        id: manifest
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/xiaomi_miio_airpurifier_ng/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches manifest version
        run: |
          tag="${{ github.event.release.tag_name }}"
          manifest_version="${{ steps.manifest.outputs.version }}"
          # Strip leading 'v' from tag if present
          tag_version="${tag#v}"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Release tag ($tag_version) does not match manifest version ($manifest_version)"
            exit 1
          fi

      - name: Create integration zip
        run: |
          cd custom_components/xiaomi_miio_airpurifier_ng
          zip -r ../../xiaomi_miio_airpurifier_ng.zip .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" xiaomi_miio_airpurifier_ng.zip --repo "$GITHUB_REPOSITORY" --clobber
