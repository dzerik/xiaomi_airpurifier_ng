name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2026.3.4'
            requirements: requirements_test_min_lock.txt
          - ha: '2026.11.2'
            requirements: requirements_test_lock.txt
    name: Home Assistant ${{ matrix.ha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install matching runtime and fixtures
        run: python -m pip install -r '${{ matrix.requirements }}'
      - name: Check release metadata
        run: python scripts/check_project.py
      - name: Run tests
        run: python -m pytest tests/ --cov=custom_components/xiaomi_miio_airpurifier_ng --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage
        if: matrix.ha == '2026.11.2'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
